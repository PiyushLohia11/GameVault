# ============================================================
# GameVault Database Connection Properties
# ============================================================

# ------------------------------------------------------------
# OPTION 1 (DEFAULT): H2 In-Memory Database (NO ORACLE NEEDED!)
# Automatically runs in Oracle compatibility mode with auto schema init.
# ------------------------------------------------------------
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:gamevault;MODE=Oracle;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
db.username=sa
db.password=

# ------------------------------------------------------------
# OPTION 2: Real Oracle Database (Uncomment when connecting to Oracle)
# ------------------------------------------------------------
# db.driver=oracle.jdbc.OracleDriver
# db.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
# db.username=SYSTEM
# db.password=YOUR_ORACLE_PASSWORD_HERE

# --- Connection Pool Settings ---
db.pool.maxPoolSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
db.pool.poolName=GameVaultPool
